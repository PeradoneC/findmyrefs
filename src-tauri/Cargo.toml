[package]
name = "findmyrefs"
version = "0.1.0"
description = "FindMyRefs - reference research and moodboards for artists"
authors = ["FindMyRefs contributors"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "findmyrefs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["v4"] }
thiserror = "2.0.21"
url = "2.5.8"
# Windows Credential Manager (and macOS Keychain / Secret Service) via the v1-compatible API.
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3.27.0"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
